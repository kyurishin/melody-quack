name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Assemble site
        env:
          MQ_SERVER: ${{ vars.MQ_SERVER || 'wss://willow-coral-204.fly.dev' }}
        run: |
          mkdir -p dist
          cp target/wasm32-unknown-unknown/release/melody-quack.wasm dist/
          cp web/index.html web/mq_js_bundle.js web/sets.js web/manifest.webmanifest web/icon64.png web/icon180.png web/icon192.png web/icon512.png dist/
          cp -r web/shots dist/
          if [ -n "$MQ_SERVER" ]; then sed -i "s|server: \"\"|server: \"$MQ_SERVER\"|" dist/sets.js; fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
