app = "willow-coral-204"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "7777"
  MQ_ACCOUNTS = "/data/accounts"
  MQ_DJS = "/data/djs.txt"
  MQ_CREDITS = "/data/credits.txt"
  MQ_PUBLIC_URL = "https://willow-coral-204.fly.dev"

[[mounts]]
  source = "mq_data"
  destination = "/data"

[http_service]
  internal_port = 7777
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
